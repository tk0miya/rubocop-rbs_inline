name: RBS collection

on:
  schedule:
    - cron: '00 8 * * MON'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      with:
        client-id: ${{ vars.REPO_HOUSEKEEPER_CLIENT_ID }}
        private-key: ${{ secrets.REPO_HOUSEKEEPER_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
      with:
        ruby-version: 3.3
        bundler-cache: true
    - name: Update rbs collection
      run: bundle exec rbs collection update
    - name: Create a pull request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        add-paths: rbs_collection.lock.yaml
        commit-message: 'rbs: Update RBS collection'
        branch: bot/rbs-collection
        title: 'rbs: Update RBS collection'
        labels: auto-merge
        token: ${{ steps.app-token.outputs.token }}
